# Render Blueprint: one web service (web app + worker in one container, with a disk for media)
# and a managed PostgreSQL database. In Render: New > Blueprint > pick this repository.
services:
  - type: web
    name: ai-creator-studio
    runtime: docker
    plan: 0.5c-512mb         # smallest paid plan; the free plan cannot have a persistent disk
    healthCheckPath: /api/health
    disk:
      name: storage
      mountPath: /app/.storage
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-creator-studio-db
          property: connectionString
      # Random 32-byte keys generated once by Render. Never change them after the first deploy:
      # APP_ENCRYPTION_KEY protects stored credentials and 2FA secrets.
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: MEDIA_SIGNING_KEY
        generateValue: true
      # Set to "false" after you have registered your own account.
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: STORAGE_DRIVER
        value: local
      - key: ENABLE_MOCK_PROVIDERS
        value: "true"
      # Optional: email for verification and password resets (e.g. smtps://user:pass@smtp.example.com:465).
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: ai-creator-studio-db
    plan: 0.1c-256mb
    databaseName: ai_creator_studio
    user: studio
    postgresMajorVersion: "17"
