# Render Blueprint, free plan: one web service (web app + worker in one container).
# The database is an external Postgres (for example a Supabase free project) given as DATABASE_URL,
# and media bytes are stored in that database (STORAGE_DRIVER=database) because free services have no disk.
# In Render: New > Blueprint > pick this repository, then paste DATABASE_URL when asked.
# For a paid setup with a disk and a Render database, see "Deploying on Render" in the README.
services:
  - type: web
    name: ai-creator-studio
    runtime: docker
    plan: free               # sleeps after 15 idle minutes; the next visit wakes it in about a minute
    region: oregon
    healthCheckPath: /api/health
    envVars:
      # Postgres connection string. For Supabase use the Session pooler (IPv4), port 5432,
      # and add ?schema=<your schema>&sslmode=require&connection_limit=3.
      - key: DATABASE_URL
        sync: false
      # Random 32-byte keys generated once by Render. Never change them after the first deploy:
      # APP_ENCRYPTION_KEY protects stored credentials and 2FA secrets.
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: MEDIA_SIGNING_KEY
        generateValue: true
      # Set to "false" after you have registered your own account.
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: STORAGE_DRIVER
        value: database
      - key: ENABLE_MOCK_PROVIDERS
        value: "true"
      # Optional: email for verification and password resets (e.g. smtps://user:pass@smtp.example.com:465).
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
